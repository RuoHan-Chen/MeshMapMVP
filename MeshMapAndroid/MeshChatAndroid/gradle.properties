# Gradle JVM memory — increase heap to fix daemon OOM crash
org.gradle.jvmargs=-Xmx2g -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle build caching and parallel execution
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Android-specific
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# Suppress noisy warnings
org.gradle.daemon.performance.disable-logging=true
